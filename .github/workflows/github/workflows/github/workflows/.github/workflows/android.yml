
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle project files are missing"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DobleYarFarsi-APK
          path: app/build/outputs/apk/debug/*.apk
          
